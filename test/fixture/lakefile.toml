name = "Fixture"
defaultTargets = ["Fixture"]

# test/run.sh pins this to the tag of the toolchain ChallengeGen is on.
[[require]]
name = "TrustAnnotations"
git = "https://github.com/LeanTrustBuilders/annotations"
rev = "main"

# Two options a challenge file must be compiled with, and two that change only what Lean reports.
[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
linter.unusedVariables = false

[[lean_lib]]
name = "Fixture"
