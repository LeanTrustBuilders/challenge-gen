name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          # The test target's checks run at elaboration time: building it runs them.
          build-args: "ChallengeGen ChallengeGenTest challenge-gen"
      # Writes the file of every declaration of test/fixture, and compiles each one.
      - name: End-to-end test
        run: test/run.sh
