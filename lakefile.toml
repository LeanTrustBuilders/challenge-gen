name = "ChallengeGen"
version = "0.1.0"
defaultTargets = ["ChallengeGen", "challenge-gen"]

# The project's declarations, and what each one needs (statement, term and source dependencies),
# come from here.
[[require]]
name = "MeaningGraph"
git = "https://github.com/LeanTrustBuilders/meaning-graph"
# `main` follows the newest toolchain, `lean-v<toolchain>` older ones.
rev = "main"

# No glob: the default builds the root module and whatever it imports, and the root imports every
# submodule. A `ChallengeGen.*` glob would sweep `ChallengeGen.Test` into the library.
[[lean_lib]]
name = "ChallengeGen"

# The `#guard` checks, as a separate target: building it runs them. Under `ChallengeGen.Test`
# rather than `Test`, since module roots are shared across a Lake workspace.
[[lean_lib]]
name = "ChallengeGenTest"
roots = ["ChallengeGen.Test"]

[[lean_exe]]
name = "challenge-gen"
root = "Main"
supportInterpreter = true
